<script>
const iframe = document.getElementById('webOrderIframe');
iframe.addEventListener('load', () => {
  const message = {
    type: "EMBED_DATA_SAVE",
    payload: JSON.parse(localStorage.getItem('data_by_wo') || '{}')
  };
  iframe.contentWindow.postMessage(message, "*");
  console.log('[SEND]', message);
});
window.addEventListener('message', (event) => {
  const data = event.data;
  if (!data || typeof data !== 'object') return;
  if (data.type === 'WO_UPDATE_DATA' && data.payload) {
    localStorage.setItem(
      'data_by_wo',
      JSON.stringify({
        ...JSON.parse(localStorage.getItem('data_by_wo') || '{}'),
        ...data.payload
      })
    );
  }
});
